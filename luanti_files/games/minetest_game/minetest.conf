# This file contains settings of Minetest Game that can be changed in
# minetest.conf.
# By default, all the settings are commented and not functional.
# Uncomment settings by removing the preceding #.

# Whether creative mode (fast digging of all blocks, unlimited resources) should
# be enabled.
#creative_mode = false

# Sets the behaviour of the inventory items when a player dies.
#   bones: Store items in a bone node but drop items if inside protected area.
#   drop: Drop items on the ground.
#   keep: Player keeps items.
bones_mode = bones

# The time in seconds after which the bones of a dead player can be looted by
# everyone.
# 0 to disable.
share_bones_time = 300

# How much earlier the bones of a dead player can be looted by
# everyone if the player dies in a protected area they don't own.
# 0 to disable. By default it is "share_bones_time" divide by four.
share_bones_time_early = 300

# Inform player of condition and location of new bones.
bones_position_message = true

# Whether fire should be enabled. If disabled, 'basic_flame' nodes will
# disappear.
# 'permanent_flame' nodes will remain with either setting.
#enable_fire = true

# Enable flame sound.
flame_sound = true

# Whether lavacooling should be enabled.
#enable_lavacooling = true

# Whether the stuff in initial_stuff should be given to new players.
give_initial_stuff = true
initial_stuff = default:pick_wood,default:axe_wood,default:shovel_wood,default:torch 5,default:apple 10

# Whether the TNT mod should be enabled.
#enable_tnt = <true in singleplayer, false in multiplayer>

# The radius of a TNT explosion.
#tnt_radius = 3

# Enable the stairs mod ABM that replaces the old 'upside down'
# stair and slab nodes in old maps with the new param2 versions.
#enable_stairs_replace_abm = false

# Whether to allow respawning in beds.
# Default value is true.
enable_bed_respawn = true

# Whether players can skip night by sleeping.
# Default value is true.
enable_bed_night_skip = true

# If enabled, fences and walls cannot be jumped over.
enable_fence_tall = false

# Whether the engine's spawn search, which does not check for a suitable
# starting biome, is used.
# Default value is false.
#engine_spawn = false

# Whether river water source nodes create flowing sounds.
# Helps rivers create more sound, especially on level sections.
river_source_sounds = false

# Enable cloud and shadow intensity variation by the 'weather' mod.
# Non-functional in V6 or Singlenode mapgens.
#enable_weather = true

# If enabled, non-player actions are logged
#log_non_player_actions = false

protector_pvp = true

allow_starting_faction = true


secure.enable_security = true
secure.http_mods = discordmt
discord.port = 8080
discord.text_color = #a7a7a7

pbj_pup_generate = true

enable_tnt = true



toolranks_levels = 80

digtron_damage_hp = 12


enable_corium_griefing = false


mt_tg.target = -1001793604660


unified_inventory_hide_disabled_buttons = true

announce_messages = Join our Discord: https://discord.gg/8MvaeeBqYz, Every few days a magic chest fills up in the PVP arena - keep an eye on the announcements in the chat, At night PVP is allowed in any territory, Watch your step otherwise you'll fall into someone else's trap, It's better to fight Balrog in a team, You can send messages to players who are offline using the mail in your inventory, At night there are more dangerous mobs, Don't leave bones near your home otherwise banshees will spawn on them, Every armor piece and weapon and tool needs an XP level - see its tooltip. Armor above your level comes off and tools above it do nothing, Gear levels: wood and stone 0 / steel and bronze and gold 5 / silver 10 / diamond and mese 15 / crystal 20 / nether 25 / netherite and elytra 30, Earn XP from kills and ores and smelting and ripe crops and fishing and breeding and villager trades. Type /xp to see your points, Death costs a quarter of your XP. It drops as orbs where you died and the orbs vanish after 5 minutes - hurry back, Anvil repairs cost 1 XP point per hammer blow. Spending too much can drop you below the level of your armor, Villagers trade for emeralds. Right-click one to see its offers - trading also gives you XP and levels the villager up, A jobless villager takes a free job site near its bed: lectern for a librarian / composter for a farmer / smithing table for a toolsmith, A villager next to an ATM becomes a banker who exchanges emeralds and minegeld, Two villagers with enough food and a free bed in their village have a child by day. Drop bread near them to help, Move villagers with a lead or give them a ride: a moving boat or cart picks up a villager nearby, Place a bell away from other villages to found your own village. Beds with a wooden door within 8 nodes count as its houses, Build an iron golem from four iron blocks in a T and a pumpkin on top. A snow golem takes two snow blocks and a pumpkin, Zombies break plain wooden doors and glass in unprotected places. Steel doors stop them, A wandering trader sometimes visits players under the open sky. They leave within an hour so check their offers quickly, Killing a pillager captain gives Bad Omen for 100 minutes. Enter a village with it and a raid begins, Beat every raid wave to become Hero of the Village and get a discount from villagers for 40 minutes, Ring a village bell during a raid to light up raiders within 32 nodes for 3 seconds, Wear at least one piece of gold armor in the Nether or piglins will attack you. Piglin brutes attack anyway, Drop a gold ingot near a calm piglin and it pays you with an item from its barter table, Never hit a zombified piglin unless you are ready: every one within 32 nodes will come for you, Punch a ghast's fireball to send it back. A returned fireball kills the ghast, Hoglins avoid warped fungi. Carry some when you walk through their territory in the Nether, Ruined portals have a broken frame: fill the gaps with obsidian (corners too) and light it to reach the Nether, Nether fortresses hide blaze spawners. Blaze rods are the key to brewing stands and to the way to the End, A respawn anchor charged with glowstone sets your respawn point in the Nether. Used anywhere else it explodes, Eye of ender = ender pearl + blaze powder. Throw it in the Overworld and it flies toward the stronghold - it may break (20%), Endermen stay calm until you look at their head. Kill them for ender pearls - they appear on the surface at night, The End portal opens when all twelve frames in the stronghold portal room hold an eye of ender, You cannot claim land in the End: no protection blocks and no areas. Do not store what you are not ready to lose, The ender dragon heals from the End crystals on the pillars. Break them first - each broken crystal also costs it 10 HP, The first player to kill the ender dragon gets 12000 XP. Later kills give 500, Four End crystals on the rim of the exit portal call the dragon back and rebuild the pillars, Elytra wait on End ships. They need level 30: jump then press jump again in the air to glide. Phantom membranes and an anvil repair them, A firework rocket used while gliding boosts your elytra flight, Shulker boxes keep their contents when broken. Craft shell + chest + shell in a column, Sleep at least once every 3 game days or phantoms will hunt you at night. Their membranes are useful for elytra and potions, Sneak in ancient cities. Moving normally wakes sculk sensors and shriekers and four warnings call the warden, The warden is blind and has 500 HP and hits for 30. It hunts by sound - stay away and sneak and it digs back down after 60 seconds, Trial spawners give a trial key when all their mobs are beaten. A vault opens once for each player who brings a key, Mace = heavy core + breeze rod. The further you fall before the hit the harder it strikes and the hit cancels your fall damage, Brewing stand = blaze rod over three cobblestone. It burns blaze powder: one powder makes 20 brews, Start every potion with a water bottle and nether wart. The craft guide lists all recipes under Brewing, Brewing costs XP and needs a level shown in the potion tooltip. Drinking and throwing potions cost nothing, Gunpowder makes a splash potion. Glowstone dust makes it stronger. Etherium dust makes it last longer, Milk clears all effects from you - both good and bad, Keep a totem of undying anywhere in your hotbar to survive a lethal blow. Evokers in mansions and raids always drop one, Enchanting costs mese crystals and XP levels. Up to 15 bookshelves two nodes from the table give stronger offers, Combine enchanted books with items on the anvil. A grindstone takes enchantments off, Smithing table: diamond gear + netherite ingot = netherite gear. Enchantments and trims stay, A beacon needs a nether star and a pyramid of mineral blocks and open sky. It gives powers to all players nearby, Summon the wither with a T of four soul sand and three wither skeleton skulls. Skulls drop 1 time in 40 from wither skeletons, Fight the wither far from home: its blasts break blocks where the summoner may build. It drops a nether star, Tame a wolf with bones (1 in 3 chance). Six armadillo scutes make wolf armor, Parrots are tamed with seeds and sit on your shoulder. Never feed them a cookie, Feed raw fish to a dolphin and it leads you toward the nearest structure for 30 seconds, Give an item to an allay from a pillager outpost and it gathers the same items lying around for you, A copper golem sorts chests: build it with a pumpkin on a copper block next to the chest you want sorted, A dried ghast placed by water hatches into a ghastling. Grown up and in a harness a happy ghast carries four players, Ride a saddled pig with a carrot on a stick and a saddled strider with a warped fungus on a stick, Creepers hurt but never break blocks. Step away within 1.5 seconds after one starts to hiss, Husks in deserts do not burn in daylight and their blows cause hunger. Rotten flesh is risky food too, A campfire cooks up to four raw foods at once without fuel. Right-click it with food, A smoker cooks food and a blast furnace smelts ores twice as fast as a furnace, A composter turns seeds and leaves and crops into bone meal, A bundle carries mixed items in one slot. Sneak + use opens it so you can take any stack out, Use a compass on a lodestone to make it point there, Dig suspicious sand and gravel with a brush (feather over copper ingot over stick). Dug without one they give nothing, Shipwreck treasure chests always hold a heart of the sea. Ocean ruins hide loot and suspicious blocks

